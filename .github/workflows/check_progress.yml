name: Check Progress

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Count files on HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: nicokaplan/pr-diffs
        run: |
          python scripts/check_progress.py | tee /tmp/progress.txt
          cat /tmp/progress.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-report
          path: /tmp/progress.txt
          retention-days: 30
