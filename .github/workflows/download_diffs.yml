name: Download PR Diffs

on:
  workflow_dispatch:
    inputs:
      job_start:
        description: 'Primer job a correr (0-43, default 0)'
        required: false
        default: '0'
      job_end:
        description: 'Último job a correr inclusive (0-43, default 43)'
        required: false
        default: '43'
      max_prs:
        description: 'Máx PRs por job (vacío = todos). Usar 20 para test rápido.'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          START=${{ github.event.inputs.job_start }}
          END=${{ github.event.inputs.job_end }}
          INDICES=$(python3 -c "import json; print(json.dumps(list(range(int('$START'), int('$END')+1))))")
          echo "matrix={\"job_idx\": $INDICES}" >> $GITHUB_OUTPUT

  download:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests huggingface_hub

      - name: Download and upload batch
        env:
          GH_TOKEN_1: ${{ secrets.GH_TOKEN_1 }}
          GH_TOKEN_2: ${{ secrets.GH_TOKEN_2 }}
          GH_TOKEN_3: ${{ secrets.GH_TOKEN_3 }}
          GH_TOKEN_4: ${{ secrets.GH_TOKEN_4 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: nicokaplan/pr-diffs
          MAX_PRS: ${{ github.event.inputs.max_prs }}
        run: |
          python scripts/download_batch.py ${{ matrix.job_idx }}

      - name: Write job summary
        if: always()
        run: |
          if [ -f /tmp/job_summary.txt ]; then
            cat /tmp/job_summary.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-job-${{ matrix.job_idx }}
          path: /tmp/download_log.jsonl
          if-no-files-found: ignore
          retention-days: 7
